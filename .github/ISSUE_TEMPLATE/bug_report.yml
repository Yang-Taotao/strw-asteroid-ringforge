name: Bug report
description: Report a problem with ringforge — crashes, wrong results, or unexpected behaviour.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please fill in as much as you can —
        the environment and reproduction details are what make bugs fixable.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "The simulation crashed at step 1000 with..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "The run should complete and produce a ring..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        The exact command you ran, plus any config files or script arguments.
        A minimal example helps enormously.
      render: shell
      placeholder: |
        conda activate amuse-py313
        python scripts/run_impact.py --config configs/base.yaml
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback / error output
      description: Paste the full error message.
      render: shell
    validations:
      required: false

  - type: input
    id: ringforge-version
    attributes:
      label: ringforge version or commit
      description: Output of `git rev-parse --short HEAD`, or the tag you are on.
      placeholder: "v0.0.1 or a1b2c3d"
    validations:
      required: true

  - type: input
    id: amuse-version
    attributes:
      label: AMUSE version
      description: Output of `python -c "import amuse; print(amuse.__version__)"`.
      placeholder: "2025.9.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.13.12"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (WSL)
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates.
          required: true
        - label: I am using the environment defined in `env.yml`.
          required: false
